name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check card version
        run: |
          version="${GITHUB_REF_NAME#v}"
          card="$(sed -n 's/^const VERSION = "\([^"]*\)";/\1/p' dist/oven-card.js)"
          if [ "$version" != "$card" ]; then
            echo "Tag $GITHUB_REF_NAME does not match card version $card" >&2
            exit 1
          fi
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No CHANGELOG.md section for $version" >&2
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/oven-card.js --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
